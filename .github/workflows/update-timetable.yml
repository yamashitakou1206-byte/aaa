name: 名鉄公式時刻表データ更新

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: 名鉄公式時刻表ページを確認
        run: |
          python - <<'PY'
          import requests

          url = "https://www.meitetsu.co.jp/train/timetable/"
          r = requests.get(url, timeout=30)
          r.raise_for_status()

          print("名鉄公式時刻表ページ取得成功")
          print("文字数:", len(r.text))
          PY

      - name: 更新内容を確認
        run: |
          echo "名鉄公式時刻表データ更新処理を開始します"
          echo "次の段階でPDF解析処理を追加します"

      - name: 変更を確認
        run: |
          git status --short
